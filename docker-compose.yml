# ---------------------------------------------------------------------------
# Vision POS - production stack.
#
# The service is completely stateless (no volumes): the SPA is baked into the
# image and all state lives in the browser or the backend. That is what makes
# it trivial to migrate: build/load the image on the new host, then start it.
#
# Usage:
#   cp .env.docker.example .env      # then edit for the server
#   docker compose build web         # first install or intentional code update
#   docker compose up -d --no-build  # reuse the local image
#   docker compose restart web       # restart without building
#   docker compose ps
# ---------------------------------------------------------------------------

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time API origin (Vite inlines it). See .env.docker.example.
        VITE_API_URL: ${VITE_API_URL:-https://apivision.winterarc.asia}
    image: ${APP_IMAGE:-vision-pos-web:latest}
    pull_policy: never
    container_name: vision-pos-web

    # Survive host reboots / crashers and re-deploys without manual help.
    restart: unless-stopped

    # Proper PID 1 handling (reaps zombies) for long-running stability.
    init: true

    ports:
      # host:container  (container always listens on 80)
      - "${APP_PORT:-8080}:80"

    environment:
      # Runtime backend origin for the optional same-origin proxy. Re-pointing
      # to a new backend needs no image rebuild.
      API_UPSTREAM: ${API_UPSTREAM:-https://apivision.winterarc.asia}

    # =====================================================================
    # Runtime limits only: building with Node needs additional host resources.
    # Memory reservation is a soft limit, not preallocated/guaranteed RAM.
    # Increase limits after measuring your actual traffic with docker stats.
    # =====================================================================
    cpus: "${WEB_CPUS:-0.50}"
    mem_limit: ${WEB_MEMORY_LIMIT:-128m}
    mem_reservation: ${WEB_MEMORY_RESERVATION:-32m}
    pids_limit: 64
    stop_grace_period: 30s

    # Bounded, rotating logs so the host disk never fills up over months.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    security_opt:
      - no-new-privileges:true
