# ---------------------------------------------------------------------------
# Vision POS - production nginx master configuration.
#
# Tuned for a long-running, low-memory static SPA server:
#   * all buffering is bounded (no unbounded growth over weeks of uptime),
#   * sockets are released instead of being held forever (timeouts + resets),
#   * access logs go to stdout/stderr so the container runtime owns their
#     rotation and the disk never fills up.
# ---------------------------------------------------------------------------

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  8192;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Request/proxy temp files use the image's compiled-in defaults
    # (/var/cache/nginx/...). They are deleted after every request, so they
    # never accumulate - there is no long-run disk growth to guard against.

    # Log to stdout/stderr -> Docker/compose handles rotation and the disk
    # never grows without bound.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      '$http_x_forwarded_for rt=$request_time';
    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    # Timeouts that release idle sockets/workers instead of holding them.
    keepalive_timeout         65s;
    keepalive_requests        1000;
    client_header_timeout     15s;
    client_body_timeout       15s;
    send_timeout              15s;
    reset_timedout_connection on;

    # Request buffering is bounded so a burst of large uploads cannot exhaust RAM.
    client_max_body_size     25m;
    client_body_buffer_size  128k;
    large_client_header_buffers 4 16k;

    # Cache open file descriptors with a hard cap (no FD/memory leak).
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    # Compression.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Virtual hosts are rendered from templates/default.conf.template by the
    # official nginx entrypoint (envsubst) at container start.
    include /etc/nginx/conf.d/*.conf;
}
