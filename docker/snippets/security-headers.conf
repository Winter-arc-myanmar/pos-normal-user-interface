# Baseline security headers.
#
# NOTE: a Content-Security-Policy is intentionally NOT set here. The POS relies
# on blob:/data: URLs (PDF/id-card printing), same-origin print iframes and the
# direct API/media origin, so a strict CSP must be designed per deployment.
# Permissions-Policy is also left unset so device features (NFC via NDEFReader,
# WebUSB/HID/serial printers) keep working on POS terminals.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
